<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>FIFA World Cup 2026 Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="fury-icon.png">
  <link rel="apple-touch-icon" href="fury-icon.png">

<style>
:root {
  --radius: 10px;
  --muted: #9bb3d6;

  --badge-normal-bg: rgba(95, 156, 255, 0.25);
  --badge-normal-border: rgba(25, 200, 244, 0.5);

  --badge-special-bg: rgba(120, 255, 120, 0.25); /* NEW GREEN */
  --badge-special-border: rgba(120, 255, 120, 0.8); /* NEW GREEN */
}

/* PAGE */
body {
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e6e6e6;
  padding: 10px;
  font-size: 14px;
}

/* TOP ACTION BUTTON */
.top-action {
  width: 100%;
  text-align: center;
  margin-bottom: 12px;
}

.buy-tickets-btn {
  display: inline-block;
  padding: 8px 18px;
  background: rgba(255, 195, 113, 0.35);
  border: 1px solid rgba(255, 195, 113, 0.8);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  text-decoration: none;
  text-shadow: 0 0 6px rgba(255, 195, 113, 0.6);
  box-shadow: 0 0 10px rgba(255, 195, 113, 0.55);
  transition: 0.2s ease;
}

.buy-tickets-btn:hover {
  background: rgba(255, 195, 113, 0.55);
  box-shadow: 0 0 16px rgba(255, 195, 113, 0.9);
  transform: translateY(-2px);
}

/* FILTER BAR */
.filters {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.filters select {
  padding: 4px 8px;
  background: rgba(95, 156, 255, 0.15);
  border: 1px solid rgba(25, 200, 244, 0.4);
  border-radius: 4px;
  color: #ffffff;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(18, 171, 253, 0.25);
}

/* TITLE */
h1 {
  text-align: center;
  font-size: 16px;
  margin-bottom: 10px;
  color: #ffffff;
  letter-spacing: 0.5px;
  text-shadow: 0 0 6px rgba(18, 171, 253, 0.4);
}

/* TABLE WRAPPER */
.table-wrap {
  width: 100%;
  margin: 6px 0 12px;
  border-radius: 6px;
  background: linear-gradient(135deg, rgba(95, 156, 255, 0.15), rgba(255, 195, 113, 0.07));
  border: 1px solid rgba(25, 200, 244, 0.4);
  box-shadow: 0 0 12px rgba(18, 171, 253, 0.35);
  overflow: hidden;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 11px;
  text-align: center;
}

/* HEADER */
th {
  padding: 4px 6px;
  background: rgba(95, 156, 255, 0.25);
  border-bottom: 1px solid rgba(25, 200, 244, 0.4);
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-size: 10px;
}

/* ROWS */
td {
  padding: 4px 6px;
  border-bottom: 1px solid rgba(25, 200, 244, 0.15);
  color: #d0d8e8;
  word-wrap: break-word;
  font-size: 11px;
}

/* SMALL VENUE */
td:nth-child(6) {
  font-size: 9px;
  opacity: 0.85;
}

/* ⭐ FULL GREEN ROW FOR SPECIAL MATCHES ⭐ */
.green-row {
  background: rgba(120, 255, 120, 0.12) !important;
}

.green-row:hover {
  background: rgba(120, 255, 120, 0.22) !important;
}

/* MATCH BADGE */
.match-badge {
  display: inline-block;
  padding: 3px 6px;
  background: var(--badge-normal-bg);
  border: 1px solid var(--badge-normal-border);
  border-radius: 4px;
  font-weight: 600;
  font-size: 10px;
  color: #ffffff;
  text-shadow: 0 0 4px rgba(18, 171, 253, 0.5);
  box-shadow: 0 0 6px rgba(18, 171, 253, 0.35);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
}

/* SPECIAL GREEN BADGE */
.match-badge.special {
  background: rgba(120, 255, 120, 0.25);
  border-color: rgba(120, 255, 120, 0.8);
  box-shadow: 0 0 10px rgba(120, 255, 120, 0.6);
  color: #eaffea;
}

/* CLICKABLE */
.match-badge.clickable {
  cursor: pointer;
}

.match-badge.clickable:hover {
  background: rgba(120, 255, 120, 0.45);
  box-shadow: 0 0 12px rgba(120, 255, 120, 0.9);
}

/* VERY SMALL DEVICES */
@media (max-width: 430px) {
  table { font-size: 10px; }

  td, th {
    padding: 3px 4px;
  }

  .match-badge {
    font-size: 9px;
    padding: 2px 5px;
  }

  td:nth-child(6) {
    font-size: 8px;
  }
}
</style>
</head>

<body>
<h1>FIFA World Cup 2026 Fixtures</h1>

<div class="top-action">
  <a href="https://galavizalbert.github.io/FURYTICKETS-WORLDCUP-2026/"
     class="buy-tickets-btn"
     target="_blank">
     Buy Tickets
  </a>
</div>

<!-- FILTERS -->
<div class="filters">
  <select id="groupFilter"><option value="">Group</option></select>
  <select id="teamFilter"><option value="">Team</option></select>
  <select id="venueFilter"><option value="">Venue</option></select>
  <select id="dateFilter"><option value="">Date</option></select>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Match</th>
      <th>Date</th>
      <th>Home</th>
      <th>Away</th>
      <th>Group</th>
      <th>Venue</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
</div>

<script src="data.js"></script>
<script>
const tbody = document.getElementById("tableBody");

const clickableMatches = ["M1", "M28", "M53", "M79", "M92"];

const groupFilter = document.getElementById("groupFilter");
const teamFilter = document.getElementById("teamFilter");
const venueFilter = document.getElementById("venueFilter");
const dateFilter = document.getElementById("dateFilter");

function populateFilters() {
  const groups = new Set();
  const teams = new Set();
  const venues = new Set();
  const dates = new Set();

  matches.forEach(m => {
    groups.add(m.group);
    teams.add(m.home);
    teams.add(m.away);
    venues.add(m.venue);
    dates.add(m.date);
  });

  groups.forEach(g => groupFilter.innerHTML += `<option value="${g}">${g}</option>`);
  teams.forEach(t => teamFilter.innerHTML += `<option value="${t}">${t}</option>`);
  venues.forEach(v => venueFilter.innerHTML += `<option value="${v}">${v}</option>`);
  dates.forEach(d => dateFilter.innerHTML += `<option value="${d}">${d}</option>`);
}

function renderTable() {
  tbody.innerHTML = "";

  matches.forEach(match => {
    if (groupFilter.value && match.group !== groupFilter.value) return;
    if (teamFilter.value && match.home !== teamFilter.value && match.away !== teamFilter.value) return;
    if (venueFilter.value && match.venue !== venueFilter.value) return;
    if (dateFilter.value && match.date !== dateFilter.value) return;

    const isClickable = clickableMatches.includes(match.match);

    const badgeHTML = isClickable
      ? `<a href="https://galavizalbert.github.io/FURYTICKETS-WORLDCUP-2026/"
           class="match-badge clickable special"
           target="_blank">${match.match}</a>`
      : `<span class="match-badge">${match.match}</span>`;

    const row = document.createElement("tr");

    if (isClickable) {
      row.classList.add("green-row");
    }

    row.innerHTML = `
      <td>${badgeHTML}</td>
      <td>${match.date}</td>
      <td>${match.home}</td>
      <td>${match.away}</td>
      <td>${match.group}</td>
      <td>${match.venue}</td>
    `;

    tbody.appendChild(row);
  });
}

[groupFilter, teamFilter, venueFilter, dateFilter].forEach(filter => {
  filter.addEventListener("change", renderTable);
});

populateFilters();
renderTable();
</script>

</body>
</html>
