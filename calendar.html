<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="fury-icon.png">
  <link rel="apple-touch-icon" href="fury-icon.png">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e6e6e6;
  padding: 18px;
}

/* TITLE */
h1 {
  text-align: center;
  font-size: 26px;
  margin: 30px 0 10px;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(18, 171, 253, 0.4);
}

/* MONTH LABEL */
.month-label {
  text-align: center;
  font-size: 22px;
  margin: 25px 0 15px;
  color: #ffc371;
  text-shadow: 0 0 10px rgba(255,195,113,0.6);
}

/* WEEKDAY LABELS */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 10px;
  text-align: center;
  font-weight: bold;
  color: #9bb3d6;
}

/* CALENDAR GRID */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 40px;
}

.day {
  background: linear-gradient(135deg, rgba(95,156,255,0.15), rgba(255,195,113,0.07));
  border: 1px solid rgba(25,200,244,0.4);
  border-radius: 8px;
  padding: 10px;
  min-height: 120px;
  box-shadow: 0 0 12px rgba(18,171,253,0.25);
}

.day h3 {
  margin: 0 0 8px;
  font-size: 14px;
  color: #fff;
  text-shadow: 0 0 6px rgba(18,171,253,0.4);
}

/* MATCH BADGES */
.match {
  display: block;
  margin-bottom: 6px;
  padding: 6px;
  border-radius: 6px;
  font-size: 11px;
  background: rgba(95,156,255,0.25);
  border: 1px solid rgba(25,200,244,0.5);
  color: #fff;
  text-shadow: 0 0 6px rgba(18,171,253,0.5);
}

.match.clickable {
  background: rgb(27, 146, 4);
  border-color: rgba(16, 73, 1, 0.8);
  box-shadow: 0 0 12px rgba(0, 70, 16, 0.6);
  cursor: pointer;
}

.match.clickable:hover {
  background: rgba(255,195,113,0.55);
  box-shadow: 0 0 16px rgba(255,195,113,0.9);
}

/* ⭐ FINAL MATCH (M104) — GOLD VERSION */
.match.final {
  background: rgba(255, 215, 0, 0.35); /* soft gold background */
  border: 2px solid rgba(255, 215, 0, 1); /* strong gold border */
  font-size: 16px;
  font-weight: 900;
  color: #fff8d6; /* warm white-gold text */
  text-shadow: 0 0 12px rgba(255, 215, 0, 1); /* gold glow */
  box-shadow: 0 0 20px rgba(255, 215, 0, 1); /* outer gold aura */
  padding: 12px;
  border-radius: 8px;
}


/* ----------------------------- */
/* ⭐ RESPONSIVE LAYOUT FIX ⭐ */
/* ----------------------------- */

/* Medium screens (tablet / small window) */
@media (max-width: 900px) {
  .calendar {
    grid-template-columns: repeat(4, 1fr);
  }
  .weekdays {
    display: none;
  }
}

/* Small screens (iPhone) */
@media (max-width: 600px) {
  body {
    padding: 10px;
    font-size: 12px;
  }
  .calendar {
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .day {
    min-height: 90px;
    padding: px;
  }
  .day h3 {
    font-size: 12px;
  }
  .match {
    font-size: 11px;
    padding: 4px;
  }
}

/* Ultra-small screens */
@media (max-width: 430px) {
  .month-label {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<h1>World Cup 2026 Calendar</h1>

<!-- JUNE -->
<div class="month-label">June 2026</div>


<div class="calendar" id="calendar-june"></div>

<!-- JULY -->
<div class="month-label">July 2026</div>


<div class="calendar" id="calendar-july"></div>

<script src="data.js"></script>
<script>
/* CLICKABLE MATCHES */
const clickable = ["M1", "M28", "M53", "M79", "M92", "M104"];

function getDayName(year, month, day) {
  const date = new Date(year, month, day);
  return date.toLocaleDateString("en-US", { weekday: "short" }); // Sun, Mon, Tue...
}


function buildMonth(containerId, startDay, endDay, offset, year, monthIndex) {
  const container = document.getElementById(containerId);

  for (let i = 0; i < offset; i++) {
    container.innerHTML += `<div class='day'></div>`;
  }

  for (let d = startDay; d <= endDay; d++) {
    const dayName = getDayName(year, monthIndex, d);

    container.innerHTML += `
      <div class='day' id='${containerId}-${d}'>
        <h3>${d} <span style="color:#9bb3d6; font-size:12px;">${dayName}</span></h3>
      </div>`;
  }
}


// June 2026 → monthIndex = 5 (0 = Jan)
buildMonth("calendar-june", 7, 30, 0, 2026, 5);

// July 2026 → monthIndex = 6
buildMonth("calendar-july", 1, 25, 3, 2026, 6);


/* PLACE MATCHES */
matches.forEach(m => {
  const dayNum = parseInt(m.date);

  if (m.date.includes("Jun") && dayNum >= 7 && dayNum <= 30) {
    placeMatch(document.getElementById(`calendar-june-${dayNum}`), m);
  }

  if (m.date.includes("Jul") && dayNum >= 1 && dayNum <= 25) {
    placeMatch(document.getElementById(`calendar-july-${dayNum}`), m);
  }
});

function placeMatch(box, m) {
  if (!box) return;

  const isClickable = clickable.includes(m.match);
  const isFinal = m.match === "FINAL";

  let cls = "match";
  if (isClickable) cls += " clickable";
  if (isFinal) cls += " final";

  box.innerHTML += `
    <div class="${cls}"
      ${isClickable ? `onclick="window.open('https://galavizalbert.github.io/FURYTICKETS-WORLDCUP-2026/')"` : ""}>
      <strong>${m.match}</strong>${m.home} vs ${m.away}
    </div>
  `;
}
</script>

</body>
</html>
