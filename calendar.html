<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="fury-icon.png">
  <link rel="apple-touch-icon" href="fury-icon.png">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #e6e6e6;
  padding: 20px;
}

/* TITLE */
h1 {
  text-align: center;
  font-size: 26px;
  margin: 30px 0 10px;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(18, 171, 253, 0.4);
}

/* MONTH LABEL */
.month-label {
  text-align: center;
  font-size: 22px;
  margin: 25px 0 15px;
  color: #ffc371;
  text-shadow: 0 0 10px rgba(255,195,113,0.6);
}

/* WEEKDAY LABELS */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 10px;
  text-align: center;
  font-weight: bold;
  color: #9bb3d6;
}

/* CALENDAR GRID */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-bottom: 40px;
}

.day {
  background: linear-gradient(135deg, rgba(95,156,255,0.15), rgba(255,195,113,0.07));
  border: 1px solid rgba(25,200,244,0.4);
  border-radius: 8px;
  padding: 10px;
  min-height: 120px;
  box-shadow: 0 0 12px rgba(18,171,253,0.25);
}

.day h3 {
  margin: 0 0 8px;
  font-size: 14px;
  color: #fff;
  text-shadow: 0 0 6px rgba(18,171,253,0.4);
}
/* FINAL MATCH SPECIAL STYLE (M104) */
.match.final {
  background: rgba(1, 20, 23, 0.884);
  border: 2px solid rgba(0, 119, 255, 0.9);
  font-size: 16px;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 0 12px rgb(0, 162, 255);
  box-shadow: 0 0 20px rgb(6, 153, 233);
  padding: 12px;
}

/* MATCH BADGES */
.match {
  display: block;
  margin-bottom: 6px;
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
  background: rgba(95,156,255,0.25);
  border: 1px solid rgba(25,200,244,0.5);
  color: #fff;
  text-shadow: 0 0 6px rgba(18,171,253,0.5);
}

.match.clickable {
  background: rgba(255,195,113,0.35);
  border-color: rgba(255,195,113,0.8);
  box-shadow: 0 0 12px rgba(255,195,113,0.6);
  cursor: pointer;
}

.match.clickable:hover {
  background: rgba(255,195,113,0.55);
  box-shadow: 0 0 16px rgba(255,195,113,0.9);
}

/* ----------------------------- */
/* ⭐ iPHONE OPTIMIZATION ⭐ */
/* ----------------------------- */

@media (max-width: 600px) {

  body {
    padding: 10px;
    font-size: 12px;
  }

  .calendar {
    gap: 4px;
  }

  .day {
    min-height: 90px;
    padding: 6px;
  }

  .day h3 {
    font-size: 12px;
    margin-bottom: 4px;
  }

  .match {
    font-size: 11px;
    padding: 4px;
    margin-bottom: 4px;
  }

  .weekdays {
    font-size: 11px;
  }
}

/* ⭐ Ultra-small screens (iPhone SE, older models) */
@media (max-width: 430px) {

  .calendar {
    grid-template-columns: repeat(2, 1fr);
  }

  .weekdays {
    display: none;
  }

  .month-label {
    font-size: 18px;
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<h1>World Cup 2026 – Full Tournament Calendar</h1>

<!-- JUNE -->
<div class="month-label">June 2026</div>

<div class="weekdays">
  <div>Sun</div><div>Mon</div><div>Tue</div>
  <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div class="calendar" id="calendar-june"></div>

<!-- JULY -->
<div class="month-label">July 2026</div>

<div class="weekdays">
  <div>Sun</div><div>Mon</div><div>Tue</div>
  <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div class="calendar" id="calendar-july"></div>

<script src="data.js"></script>
<script>
/* CLICKABLE MATCHES */
const clickable = ["M1", "M28", "M53", "M79", "M92"];

/* BUILD MONTH GRID (custom start/end days) */
function buildMonth(containerId, startDay, endDay, offset) {
  const container = document.getElementById(containerId);

  // Add empty boxes before the first day
  for (let i = 0; i < offset; i++) {
    container.innerHTML += `<div class='day'></div>`;
  }

  // Add actual days
  for (let d = startDay; d <= endDay; d++) {
    container.innerHTML += `
      <div class='day' id='${containerId}-${d}'>
        <h3>${d}</h3>
      </div>`;
  }
}

/* JUNE: Start June 7, end June 30 — June 7, 2026 is SUNDAY → offset 0 */
buildMonth("calendar-june", 7, 30, 0);

/* JULY: Start July 1, end July 25 — July 1, 2026 is WEDNESDAY → offset 3 */
buildMonth("calendar-july", 1, 25, 3);

/* PLACE MATCHES */
matches.forEach(m => {
  const dayNum = parseInt(m.date);

  // JUNE 7–30
  if (m.date.includes("Jun") && dayNum >= 7 && dayNum <= 30) {
    const box = document.getElementById(`calendar-june-${dayNum}`);
    placeMatch(box, m);
  }

  // JULY 1–25
  if (m.date.includes("Jul") && dayNum >= 1 && dayNum <= 25) {
    const box = document.getElementById(`calendar-july-${dayNum}`);
    placeMatch(box, m);
  }
});

function placeMatch(box, m) {
  if (!box) return;

  const isClickable = clickable.includes(m.match);
  const isFinal = m.match === "M104";  // FINAL IS NOW M104

  let cls = "match";
  if (isClickable) cls += " clickable";
  if (isFinal) cls += " final";

  box.innerHTML += `
    <div class="${cls}"
      ${isClickable ? `onclick="window.open('https://galavizalbert.github.io/FURYTICKETS-WORLDCUP-2026/')"` : ""}>
      <strong>${m.match}</strong> — ${m.home} vs ${m.away}
    </div>
  `;
}

</script>

</body>
</html>
